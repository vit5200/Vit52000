<style>
:root{--font:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","Songti TC","Hiragino Mincho ProN","PMingLiU",serif;--serif:var(--font);
--bg:#0a0a0c;--bg2:#131316;--panel:#141417;--panel2:#1d1d21;--line:rgba(214,170,76,.5);--line2:rgba(214,170,76,.2);
--gold:#e3b64b;--goldhi:#fff0b3;--goldlo:#9a6a14;--red:#c1121f;--redhi:#e0262f;--redlo:#6d0910;
--b1:#9a6a14;--b2:#fff0b3;--l1:#6d0910;--l2:#e0262f;--lnc:#ff5a5a;--ink:#f3eee2;--ink2:#d9d2c0;--mute:#9a9385;--dim:#6b665b;--win:#5fd99d;--loss:#ff6b6b;--sc:rgba(214,170,76,.06);--nav:#000;--glow:rgba(140,12,20,.35)}
html,body{background:var(--bg)}
body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;color:var(--ink);
background-color:var(--bg);background-image:radial-gradient(ellipse 120% 55% at 50% 0,var(--glow),transparent 70%),
radial-gradient(circle at 50% 100%,transparent 0 38%,var(--sc) 39% 43%,transparent 44% 52%,var(--sc) 53% 57%,transparent 58% 66%,var(--sc) 67% 71%,transparent 72%),
radial-gradient(circle at 50% 100%,transparent 0 38%,var(--sc) 39% 43%,transparent 44% 52%,var(--sc) 53% 57%,transparent 58% 66%,var(--sc) 67% 71%,transparent 72%);
background-size:100% 100%,60px 30px,60px 30px;background-position:0 0,0 0,30px 15px}
button{touch-action:manipulation}input,select{font-size:max(16px,1rem)}
b,strong{font-family:var(--serif);font-weight:800}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:center;font-weight:600}
input[type=date]::-webkit-date-and-time-value{text-align:center}
[data-pid]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{background:var(--bg2);color:var(--ink);border:1px solid var(--line)!important;border-radius:4px}
input:focus{outline:none;border-color:var(--gold)!important;box-shadow:0 0 0 2px rgba(227,182,75,.3)}
::placeholder{color:var(--dim)}
/* 元件 */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,235,170,.07)}
.gold-text{background:linear-gradient(180deg,#fff6c8 0%,#f2c75a 42%,#b7791f 72%,#f6d77a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.55))}
.gbtn{background:linear-gradient(180deg,#1c1c20,#0c0c0e);color:var(--gold);border:1px solid var(--gold);border-radius:4px;font-family:var(--serif);font-weight:800}
.banner-w{display:inline-block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.banner{display:inline-block;padding:.32rem 2.1rem;color:var(--goldhi);font-family:var(--serif);font-weight:900;letter-spacing:.1em;text-shadow:0 1px 0 #000;
background:linear-gradient(180deg,#d4222c,#7a0b12);clip-path:polygon(0 20%,2% 4%,9% 14%,31% 2%,60% 12%,92% 0,98% 16%,100% 62%,96% 100%,70% 90%,38% 100%,8% 92%,0 82%)}
.rule{height:10px;margin:6px auto 0;max-width:260px;background:linear-gradient(90deg,transparent,var(--gold),transparent) center/100% 1px no-repeat;position:relative}
.rule:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
#hdr{background:linear-gradient(180deg,#000,#101013)!important;border-bottom:1px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.6)}
#nav{background:var(--nav)!important;border-top:1px solid var(--gold);box-shadow:0 -6px 22px rgba(0,0,0,.45)!important}
.nav-on{box-shadow:inset 0 3px 0 var(--redhi)}
.debt-pill{font-size:0.6875rem;font-weight:700;padding:1px 7px;border-radius:3px;border:1px solid var(--loss);color:var(--loss);background:transparent;white-space:nowrap}
.debt-pill.paid{border-color:var(--dim);color:var(--dim);text-decoration:line-through}
.debt-on{background:linear-gradient(180deg,var(--redhi),var(--redlo));color:var(--goldhi);border:1px solid var(--gold)}
.debt-off{background:transparent;color:var(--mute);border:1px dashed var(--line)}
/* 排行卡 */
.rk-card{position:relative;border:1px solid var(--line);background:#050506;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 6px 16px rgba(0,0,0,.45)}
.rk-head{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.35rem 0;background:linear-gradient(180deg,#34080b,#12090a);border-bottom:1px solid var(--line)}
.rk-no{font-family:var(--serif);font-weight:900;font-size:1.625rem;line-height:1}
.rk-ar{position:absolute;left:8px;top:6px;font-size:0.6875rem;line-height:1.1;text-align:center;font-weight:800}
.rk-ar i{display:block;font-style:normal;font-size:0.4375rem;color:var(--mute);letter-spacing:.05em}
.rk-lab{text-align:center;font-size:0.75rem;color:var(--mute);background:linear-gradient(180deg,#1b1b1f,#0d0d10);border-bottom:1px solid var(--line2);padding:2px 0}
.rk-val{text-align:center;font-family:var(--serif);font-weight:900;font-size:1.375rem;padding:4px 0 6px;background:#000}
.rk-ph{position:relative;aspect-ratio:3/4;background:#111;overflow:hidden}
.rk-ph img{width:100%;height:100%;object-fit:cover;display:block}
.rk-ph .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:4.75rem;color:rgba(255,255,255,.9);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.rk-nm{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.88));text-align:center}
.rk-row{display:flex;align-items:center;gap:.6rem;padding:.6rem .75rem;background:#050506;border:1px solid var(--line);margin-bottom:6px;border-radius:3px}
/* 以 CSS 重新著色既有 Tailwind 類別 */
html .bg-white,html [class*="bg-white/"]{background-color:var(--panel)!important}
html .bg-slate-50{background-color:var(--panel2)!important}
html .bg-slate-100{background-color:var(--bg2)!important}
html .border-slate-100{border-color:var(--line2)!important}html .border-slate-200{border-color:var(--line)!important}
html .text-slate-800,html .text-slate-700{color:var(--ink)!important}html .text-slate-600{color:var(--ink2)!important}
html .text-slate-500,html .text-slate-400{color:var(--mute)!important}html .text-slate-300{color:var(--dim)!important}
html .bg-indigo-50{background-color:var(--panel2)!important}
html .bg-indigo-100{background-color:rgba(193,18,31,.35)!important}
html .text-indigo-700,html .text-indigo-600,html .text-indigo-500{color:var(--gold)!important}
html .border-indigo-500{border-color:var(--gold)!important}
html .bg-indigo-600{background:linear-gradient(180deg,var(--redhi),var(--redlo))!important;color:var(--goldhi)!important;border:1px solid var(--gold)!important}
html .from-indigo-600{--tw-gradient-from:var(--redhi)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important;color:var(--goldhi)!important;border:1px solid var(--gold);font-family:var(--serif)}
html .to-violet-600{--tw-gradient-to:var(--redlo)!important}
html .from-emerald-400{--tw-gradient-from:var(--redhi)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
html .to-teal-500{--tw-gradient-to:var(--redlo)!important}
html .from-emerald-500{--tw-gradient-from:var(--b1)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
html .to-emerald-300{--tw-gradient-to:var(--b2)!important}
html .from-red-500{--tw-gradient-from:var(--l1)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
html .to-red-300{--tw-gradient-to:var(--l2)!important}
html .from-amber-50{--tw-gradient-from:rgba(227,182,75,.16)!important;--tw-gradient-to:transparent!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
html .bg-emerald-50,html .bg-red-50{background-color:var(--panel2)!important}
html .bg-amber-50{background-color:rgba(227,182,75,.12)!important}
html .text-amber-700,html .text-amber-600{color:var(--gold)!important}html .border-amber-200{border-color:var(--line)!important}
html .text-emerald-600,html .text-emerald-700{color:var(--win)!important}
html .text-red-500{color:var(--loss)!important}
html .border-fuchsia-400{border-color:var(--gold)!important}
html .ring-indigo-600,html .ring-indigo-500{--tw-ring-color:var(--gold)!important}
html .from-amber-400{--tw-gradient-from:var(--goldlo)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
html .to-orange-500{--tw-gradient-to:var(--gold)!important}
html .shadow-md,html .shadow-lg,html .shadow-2xl,html .shadow{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.4)!important}
html .rounded-3xl{border-radius:6px!important}html .rounded-2xl{border-radius:5px!important}html .rounded-xl{border-radius:4px!important}
html button.rounded-full{border-radius:4px!important}
html .bg-black\/80{background:rgba(0,0,0,.88)}

/* ===== v14：文字放大、標題列、紅底字、滑動切換、排行列 ===== */
body{font-size:1.0625rem;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
html .text-xs{font-size:0.875rem!important;line-height:1.4!important}
html .text-sm{font-size:1rem!important;line-height:1.45!important}
html .text-base{font-size:1.0625rem!important}
html .text-lg{font-size:1.25rem!important}
html .text-xl{font-size:1.4375rem!important}
html .text-2xl{font-size:1.75rem!important}
html .text-\[11px\]{font-size:0.8125rem!important}
html .text-\[10px\]{font-size:0.75rem!important}
html .text-\[17px\]{font-size:1.1875rem!important}
#hdr{height:auto!important;align-items:center!important;padding-top:calc(env(safe-area-inset-top) + 14px)!important;padding-bottom:10px!important;min-height:4rem}
.gbtn{font-size:1rem}
.banner{font-size:1.1875rem;padding:.38rem 2.2rem}
html .bg-indigo-600,html .from-indigo-600{font-size:1.0625rem!important;font-weight:900!important}
html .from-emerald-400{font-size:1.125rem!important;font-weight:800}
.debt-on{font-size:0.9375rem!important}
.debt-pill{font-size:0.8125rem}
.rk2{display:flex;align-items:center;gap:.55rem;padding:.75rem .7rem;margin-bottom:8px;background:linear-gradient(180deg,#0d0d10,#050506);border:1px solid var(--line);border-radius:5px;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4)}
.rk2.top{border-color:var(--gold);box-shadow:0 0 0 1px #000,0 0 16px rgba(227,182,75,.22)}

<script>
const K='mj_data_v1';
let S;try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
S=S||{players:[],games:[]};S.venues=S.venues||[];
const cleanId=s=>String(s==null?'':s).replace(/[^\w-]/g,'').slice(0,40);
const cleanCol=c=>/^#[0-9a-fA-F]{3,8}$/.test(c)?c:'#94a3b8';
const cleanStr=(s,n)=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f]/g,'').slice(0,n);
const okPhoto=p=>typeof p==='string'&&p.length<600000&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(p);
const fin=(v,d=0)=>Number.isFinite(+v)?+v:d;
/* 匯入／讀取時的資料驗證：避免壞檔或惡意檔案注入畫面 */
function sanitizeData(d){
  if(!d||!Array.isArray(d.players)||!Array.isArray(d.games))throw 0;
  const players=[];
  d.players.forEach(p=>{if(!p)return;const id=cleanId(p.id),name=cleanStr(p.name,24);if(!id||!name||players.some(x=>x.id===id))return;const o={id,name,color:cleanCol(p.color)};if(okPhoto(p.photo))o.photo=p.photo;players.push(o)});
  const games=[];
  d.games.forEach(g=>{
    if(!g||!Array.isArray(g.res))return;const id=cleanId(g.id);if(!id||!/^\d{4}-\d{2}-\d{2}$/.test(g.date)||games.some(x=>x.id===id))return;
    const res=[];let bad=false;
    g.res.forEach(r=>{if(!r||bad)return;const rid=cleanId(r.id);if(!rid||!Number.isFinite(+r.amt)){bad=true;return}
      const o={id:rid,name:cleanStr(r.name,24),color:cleanCol(r.color),amt:fin(r.amt)};
      if(r.unk)o.unk=1;if(r.debt){o.debt=Math.abs(fin(r.debt));o.paid=r.paid?1:0}res.push(o)});
    if(bad||!res.length)return;
    games.push({id,date:g.date,vid:cleanId(g.vid),vname:cleanStr(g.vname,40),rounds:Math.max(0,Math.round(fin(g.rounds))),fee:Math.max(0,fin(g.fee)),res});
  });
  const venues=[];(Array.isArray(d.venues)?d.venues:[]).forEach(v=>{if(!v)return;const id=cleanId(v.id),name=cleanStr(v.name,40);if(id&&name&&!venues.some(x=>x.id===id))venues.push({id,name})});
  return {players,games,venues};
}
try{if(S&&Array.isArray(S.players)&&Array.isArray(S.games))S=sanitizeData(S);else S=null}catch(e){S=null}
S=S||{players:[],games:[],venues:[]};
/* 延遲合併儲存（打字時不會每個字都寫入），離開頁面時立即寫入 */
let _st=0,_warned=false;
const saveNow=()=>{clearTimeout(_st);_st=0;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){if(!_warned){_warned=true;alert('儲存失敗：瀏覽器儲存空間不足或被封鎖。請先匯出備份。')}}};
const save=()=>{clearTimeout(_st);_st=setTimeout(saveNow,150)};
addEventListener('pagehide',()=>{if(_st)saveNow()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&_st)saveNow()});
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const money=n=>(n>0?'+':n<0?'−':'')+Math.abs(n).toLocaleString();
const cls=n=>n>0?'text-emerald-600':n<0?'text-red-500':'text-slate-400';

function trs(s){
  if(LANG==='zh'||typeof s!=='string')return s;
  const i=LANG==='en'?0:1,core=s.trim();
  if(EX[core])return s.replace(core,EX[core][i]);
  let o=s;
  for(const r of RULES)o=o.replace(r[0],r[i+1]);
  for(const k of DK)if(o.includes(k))o=o.split(k).join(DICT[k][i]);
  return o;
}
function tr(root){
  if(!root||LANG==='zh')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),a=[];let n;
  while(n=w.nextNode())a.push(n);
  a.forEach(n=>{const v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
  root.querySelectorAll('[placeholder]').forEach(e=>{e.placeholder=trs(e.placeholder)});
}

function openPrefs(){
  const o=$('sc'),t=o?o.scrollTop:0;
  mset(prefsView());tr($('modal'));document.body.style.overflow='hidden';$('sc').scrollTop=t;bkRender();
}
function setLang(k){PREF.lang=LANG=k;savePref();applyTheme();openPrefs();render()}
const feeOn=()=>PREF.fee!==false;
function setFeeOn(b){PREF.fee=b;savePref();openPrefs();render()}
function setDebtOn(b){PREF.debt=b;savePref();openPrefs();render()}
function setMin(e){e.value=e.value.replace(/\D/g,'');PREF.minGames=e.value===''?0:+e.value;savePref()}
function setFs(k){const h=document.documentElement;h.classList.add('tx');PREF.fs=k;savePref();applyTheme();openPrefs();setTimeout(()=>h.classList.remove('tx'),600)}
function setTheme(k){const h=document.documentElement;h.classList.add('tx');PREF.theme=k;savePref();applyTheme();openPrefs();setTimeout(()=>h.classList.remove('tx'),600)}

function dragInit(box){
  if(!box)return;
  let d=null,timer=0,sx=0,sy=0;
  const cs=()=>[...box.querySelectorAll('[data-pid]')];
  const begin=(el,x,y)=>{sx=x;sy=y;clearTimeout(timer);timer=setTimeout(()=>{d={el,moved:false};el.style.transform='scale(1.12)';el.style.boxShadow='0 8px 20px rgba(0,0,0,.3)';el.style.zIndex=5;navigator.vibrate&&navigator.vibrate(15)},380)};
  const move=(x,y,ev)=>{
    if(!d){if(Math.abs(x-sx)>8||Math.abs(y-sy)>8)clearTimeout(timer);return}
    if(ev.cancelable)ev.preventDefault();
    d.moved=true;
    const over=cs().find(c=>{if(c===d.el)return false;const r=c.getBoundingClientRect();return x>r.left&&x<r.right});
    if(over){const r=over.getBoundingClientRect();box.insertBefore(d.el,x<r.left+r.width/2?over:over.nextSibling)}
    const b=box.getBoundingClientRect();if(x<b.left+36)box.scrollLeft-=10;else if(x>b.right-36)box.scrollLeft+=10;
  };
  const end=()=>{
    clearTimeout(timer);if(!d)return;const x=d;d=null;
    x.el.style.transform=x.el.style.boxShadow=x.el.style.zIndex='';
    dragEnd=Date.now();
    if(x.moved){const ids=cs().map(c=>c.dataset.pid);S.players=[...ids.map(i=>pl(i)).filter(Boolean),...S.players.filter(p=>!ids.includes(p.id))];save()}
  };
  box.addEventListener('touchstart',e=>{const el=e.target.closest('[data-pid]');if(el)begin(el,e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  box.addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY,e),{passive:false});
  box.addEventListener('touchend',end);box.addEventListener('touchcancel',end);
  box.addEventListener('mousedown',e=>{const el=e.target.closest('[data-pid]');if(el)begin(el,e.clientX,e.clientY)});
  box.addEventListener('mousemove',e=>{if(e.buttons||d)move(e.clientX,e.clientY,e)});
  box.addEventListener('mouseup',end);box.addEventListener('mouseleave',end);
}

    const left=await bkAll(),drop=[];['auto','manual'].forEach(k=>left.filter(x=>x.kind===k).slice(10).forEach(x=>drop.push(x.id)));

const xd=s=>s.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g,(m,k)=>k==='amp'?'&':k==='lt'?'<':k==='gt'?'>':k==='quot'?'"':k==='apos'?"'":String.fromCodePoint(k[1]==='x'||k[1]==='X'?parseInt(k.slice(2),16):parseInt(k.slice(1),10)));

const tText=x=>[...x.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(m=>xd(m[1])).join('');
function sheetRows(xml,shared){
  const rows=[];
  for(const rm of xml.matchAll(/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g)){
    const row=[];
    for(const cm of (rm[1]||'').matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const ref=attr(cm[1],'r')||'',t=attr(cm[1],'t'),inner=cm[2]||'';
      const col=[...ref.replace(/\d+/g,'')].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;
      let v=null;
      if(t==='inlineStr')v=tText(inner);
      else{const vm=inner.match(/<v>([\s\S]*?)<\/v>/);if(vm){const raw=xd(vm[1]);v=t==='s'?shared[+raw]:(t==='str'||t==='e'||t==='b')?raw:+raw}}
      if(col>=0)row[col]=v;
    }

}
async function readXlsxBackup(f){
  const files=await unzipText(await f.arrayBuffer());
  const wb=files['xl/workbook.xml'],rel=files['xl/_rels/workbook.xml.rels'];if(!wb||!rel)throw 0;
  const tg={};for(const m of rel.matchAll(/<Relationship\b([^>]*)>/g))tg[attr(m[1],'Id')]=attr(m[1],'Target');
  const ss=files['xl/sharedStrings.xml'];
  const shared=ss?[...ss.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)].map(m=>tText(m[1].replace(/<rPh\b[\s\S]*?<\/rPh>/g,''))):[];
  const sheets=[...wb.matchAll(/<sheet\b([^>]*)>/g)].map(m=>{const t=tg[attr(m[1],'r:id')]||'';return{name:attr(m[1],'name'),path:t.startsWith('/')?t.slice(1):'xl/'+t}});
  const rowsOf=n=>{const s=typeof n==='number'?sheets[n]:sheets.find(x=>x.name===n);return s&&files[s.path]?sheetRows(files[s.path],shared):null};
  const gr=rowsOf(0);if(!gr)throw 0;
  const players=[],pm={};
  const mk=(name,color,photo)=>{const p={id:uid(),name,color:color||COLORS[players.length%COLORS.length]};if(photo)p.photo=photo;players.push(p);pm[name]=p;return p};
  (rowsOf('_players')||[]).forEach(r=>{if(r[0]!=null&&r[0]!=='')mk(String(r[0]),r[1]?String(r[1]):'',r.slice(2).filter(x=>x!=null&&x!=='').join(''))});
  const vn=[];const addV=n=>{if(n&&!vn.includes(n))vn.push(n)};
  (rowsOf('_venues')||[]).forEach(r=>addV(r[0]==null?'':String(r[0])));
  const dstr=v=>typeof v==='number'?new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10):String(v==null?'':v).trim().slice(0,10);
  const debtOf=(s,a)=>{const t=String(s==null?'':s).trim();if(!t||a>=0)return{};if(/未付|unpaid|未払/i.test(t))return{debt:-a,paid:0};if(/已還|paid|返済/i.test(t))return{debt:-a,paid:1};return{}};
  const games=[];
  gr.slice(1).forEach(r=>{
    const date=dstr(r[0]);if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
    const res=[];
    for(let i=0;i<4;i++){
      const nm=r[4+i*2],am=r[5+i*2];
      if(nm==null||String(nm).trim()==='')continue;
      if(am==null||am===''){res.push({id:'unk',name:'未知',color:'#94a3b8',amt:0,unk:1});continue}
      const name=String(nm).trim(),p=pm[name]||mk(name);
      res.push({id:p.id,name:p.name,color:p.color,amt:+am||0,...debtOf(r[12+i],+am||0)});
    }
    if(res.length!==4)return;
    const v=r[1]==null?'':String(r[1]).trim();addV(v);
    games.push({id:uid(),date,vid:'',vname:v,rounds:parseInt(r[2])||0,fee:parseFloat(r[3])||0,res});
  });
  if(!games.length)throw 0;
  const venues=vn.map(n=>({id:uid(),name:n}));
  games.forEach(g=>{const v=venues.find(x=>x.name===g.vname);if(v)g.vid=v.id});
  const prefs={};(rowsOf('_prefs')||[]).forEach(r=>{if(r[0]!=null&&r[1]!=null)prefs[String(r[0])]=String(r[1])});
  return {players,games,venues,prefs};
}

/* 統計 */
function stats(y){
  return S.players.map(p=>{
    let n=0,w=0,l=0,sum=0;
    S.games.forEach(g=>{if(y&&!g.date.startsWith(y))return;g.res.forEach(r=>{if(r.id!==p.id)return;n++;sum+=r.amt;if(r.amt>0)w++;else if(r.amt<0)l++})});
    return {p,n,w,l,d:n-w-l,sum:r2(sum)};
  });
}

/* 3 勝率 */

  const mg=PREF.minGames||0,st=stats().filter(s=>s.n>mg).sort((a,b)=>{const ra=a.n?a.w/a.n:-1,rb=b.n?b.w/b.n:-1;return rb-ra||b.n-a.n||b.sum-a.sum});
  const note=mg>0?`<div class="text-xs text-slate-400 mb-2 px-1">${L(`已隱藏參與 ${mg} 場以內的玩家（可在設定頁調整）`,`Players with ${mg} games or fewer are hidden (change in Settings)`,`${mg}局以下のプレイヤーは非表示（設定で変更できます）`)}</div>`:'';

/* 5 排行 */
function rankList(y){
  const gs=S.games.filter(g=>!y||g.date.startsWith(y));
  const last=[...gs].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).pop();
  const calc=sk=>{const m={};S.players.forEach(p=>m[p.id]={n:0,sum:0});gs.forEach(g=>{if(g.id===sk)return;g.res.forEach(r=>{const o=m[r.id];if(!o)return;o.n++;o.sum+=r.amt})});return m};
  const prev=last?calc(last.id):calc(null);
  const pr=S.players.filter(p=>prev[p.id].n>0).sort((a,b)=>prev[b.id].sum-prev[a.id].sum).map(p=>p.id);
  return stats(y).filter(s=>s.n>0).sort((a,b)=>b.sum-a.sum).map((s,i)=>{const j=pr.indexOf(s.p.id);return{...s,rank:i+1,mv:j<0?'new':j>i?'up':j<i?'down':'same'}});
}
const mvHTML=m=>{const c={up:['▲','#ef4444'],down:['▼','#38bdf8'],same:['➡','#e3b64b'],new:['✦','#e3b64b']}[m];return `<span class="rk-ar" style="color:${c[0]==='▲'?'#ef4444':c[1]}">${c[0]}<i>RANK</i></span>`};
const mvInline=m=>{const c={up:['▲','#ef4444'],down:['▼','#38bdf8'],same:['−','#22c55e'],new:['✦','#e3b64b']}[m];return `<span class="mv${m==='same'?' same':''}" style="color:${c[1]}">${c[0]}</span>`};
const rkIcon=r=>{
  const C={1:['#fff07a','#f4a800','#9a5f00','#d6283a'],2:['#ffffff','#b9c4d0','#66727f','#2f6fe0'],3:['#ffc592','#cd7f32','#78400f','#2a9a52']}[r];if(!C)return '';
  return `<svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="gc${r}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C[0]}"/><stop offset="1" stop-color="${C[1]}"/></linearGradient></defs><path d="M3 24.5L1.6 9.2l8 6 6.4-11 6.4 11 8-6L29 24.5z" fill="url(#gc${r})" stroke="${C[2]}" stroke-width="1.4" stroke-linejoin="round"/><rect x="3" y="24.5" width="26" height="4" rx="1.2" fill="${C[1]}" stroke="${C[2]}" stroke-width="1.2"/><circle cx="16" cy="4" r="2" fill="${C[0]}" stroke="${C[2]}" stroke-width="1"/><circle cx="2" cy="9" r="1.6" fill="${C[0]}" stroke="${C[2]}" stroke-width="1"/><circle cx="30" cy="9" r="1.6" fill="${C[0]}" stroke="${C[2]}" stroke-width="1"/><circle cx="16" cy="19.5" r="2.1" fill="${C[3]}"/></svg>`;
};
const rkNo=n=>LANG==='en'?'#'+n:n+'位';
function debtPanel(){
  if(!debtOn())return '';
  const m={};
  S.games.forEach(g=>g.res.forEach((r,i)=>{if(!r.debt||r.paid)return;const o=m[r.id]=m[r.id]||{id:r.id,name:r.name,color:r.color,sum:0,items:[]};o.sum=r2(o.sum+r.debt);o.items.push({g,i,r})}));
  const arr=Object.values(m).sort((a,b)=>b.sum-a.sum),tot=r2(arr.reduce((a,b)=>a+b.sum,0));
  const rows=arr.map(o=>{const p=pl(o.id);return `<div class="px-4 py-3 border-t border-slate-100"><div class="flex items-center gap-3">${av(o.name,o.color,p&&p.photo,44,p?o.id:'')}<b class="truncate text-lg">${esc(o.name)}</b><b class="ml-auto text-xl text-red-500 shrink-0">${money(-o.sum)}</b></div><div class="mt-2 space-y-1.5">${o.items.sort((a,b)=>b.g.date.localeCompare(a.g.date)).map(x=>`<div class="flex items-center justify-between text-xs text-slate-500"><span>${x.g.date}${x.g.vname?' · '+esc(x.g.vname):''}</span><span class="flex items-center gap-2"><b class="text-slate-700">${x.r.debt.toLocaleString()}</b><button onclick="payDebt('${x.g.id}',${x.i})" class="debt-pill">${L('標記已還','Mark paid','返済済にする')}</button></span></div>`).join('')}</div><button onclick="payAll('${o.id}')" class="gbtn mt-3 w-full h-10 text-sm active:scale-95 transition">${L('全部還清','Settle all','全額返済')}</button></div>`}).join('');
  return `<div data-tour="debtList" class="mt-8"><div class="text-center mb-3">${banner(L('欠款清單','Debts','ツケ一覧'))}</div><div class="panel overflow-hidden"><div class="px-4 py-3 flex items-center justify-between"><span class="text-sm text-slate-500">${L('未還款總額','Outstanding total','未返済の合計')}</span><b class="text-2xl ${tot?'text-red-500':'text-emerald-600'}">${tot?money(-tot):L('✓ 無欠款','✓ All clear','✓ なし')}</b></div>${rows}</div></div>`;
}
function v4(){
  if(!S.players.length||!S.games.length)return empty;
  const ys=[...new Set(S.games.map(g=>g.date.slice(0,4)))].sort().reverse();
  if(rankY!=='all'&&!ys.includes(rankY))rankY='all';
  const y=rankY==='all'?'':rankY,rl=rankList(y),gn=S.games.filter(g=>!y||g.date.startsWith(y)).length;
  const chip=(v,t)=>`<button ${rankY===v?'data-sel':''} onclick="rankY='${v}';render()" class="h-11 px-5 text-sm font-bold shrink-0 ${BTN} ${rankY===v?'bg-indigo-600 text-white shadow':'bg-white text-slate-600 border border-slate-200'}">${t}</button>`;
  const rows=rl.map((s,ix)=>{
    const p=s.p,first=s.rank===1,top=s.rank<=3;
    return `<div ${first?'data-tour="rk"':''} style="--i:${ix}" class="rk2 ${top?'top g'+s.rank:''} ${first?'first':''}"><div class="rkc">${s.rank<=3?`<span class="rk-ic">${rkIcon(s.rank)}</span>`:''}<b class="rk-n">${s.rank}</b>${mvInline(s.mv)}</div>${av(p.name,p.color,p.photo,first?80:56,p.id)}<div class="min-w-0 flex-1"><b class="block truncate ${first?'text-2xl':'text-xl'}">${esc(p.name)}</b><span class="block text-[15px] font-bold text-slate-600 whitespace-nowrap leading-snug">${L(`${s.n} 場`,`${s.n} games`,`${s.n}局`)}</span><span class="block text-[15px] font-bold text-slate-600 whitespace-nowrap leading-snug">${L(`勝${s.w}／負${s.l}`,`W${s.w} / L${s.l}`,`勝${s.w}／負${s.l}`)}</span></div><div class="text-right shrink-0"><b class="cu block text-2xl ${cls(s.sum)}">${money(s.sum)}</b><span class="inline-block mt-1 px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-600 text-sm font-bold">${L('勝率','Win rate','勝率')} ${rateOf(s)}%</span></div></div>`;
  }).join('');
  return pageHead(L('排行榜','Ranking','ランキング'),y?L(`${y} 年排行`,`${y} Ranking`,`${y}年ランキング`):L('歷年累積','All-time','通算'))+`<div data-hs="rank" class="relative flex gap-2 overflow-x-auto pb-3 -mx-3 px-3">${chip('all',L('歷年累積','All-time','通算'))}${ys.map(v=>chip(v,v+L(' 年','','年'))).join('')}</div>
  <div class="text-sm text-slate-400 mb-3 px-1 leading-relaxed">${L(`共 ${gn} 場　※箭頭為與上一場前的名次比較`,`${gn} games · arrows compare with the rank before the latest game`,`全${gn}局　※矢印は直前の対局前との順位比較`)}</div>
  ${rl.length?rows:`<div class="panel p-6 text-center text-slate-400">${L('此年度無資料','No data for this year','この年のデータなし')}</div>`}${debtPanel()}`;
}

/* 設定：人員與場所 */
function setView(){
  const prow=S.players.map(p=>`<div data-tour="pl-card" class="${CARD} p-3 mb-2"><div class="flex items-center gap-3 mb-3">${av(p.name,p.color,p.photo,60)}<label class="flex-1 h-12 rounded-xl bg-indigo-50 text-indigo-700 font-semibold flex items-center justify-center ${BTN}">📷 ${p.photo?'更換照片':'選擇照片'}<input type="file" accept="image/*" class="hidden" onchange="setPhoto('${p.id}',this)"></label>${p.photo?`<button onclick="rmPhoto('${p.id}')" class="h-12 px-4 rounded-xl bg-slate-100 text-slate-500 font-semibold ${BTN}">移除</button>`:''}</div><div class="flex gap-2 mb-2"><input value="${esc(p.name)}" maxlength="8" oninput="rn('${p.id}',this.value)" class="flex-1 min-w-0 h-12 rounded-xl border-2 border-slate-200 px-3 text-lg font-medium"><button onclick="delP('${p.id}')" class="h-12 px-4 rounded-xl bg-red-50 text-red-500 font-semibold ${BTN}">刪除</button></div><div class="flex flex-wrap gap-2">${COLORS.map(c=>`<button onclick="setC('${p.id}','${c}')" class="w-10 h-10 rounded-full active:scale-90 ${p.color===c?'ring-4 ring-offset-1 ring-slate-400':''}" style="background:${c}"></button>`).join('')}<label class="w-10 h-10 rounded-full relative flex items-center justify-center text-lg border-2 border-dashed border-slate-300 overflow-hidden ${COLORS.includes(p.color)?'bg-white':'ring-4 ring-offset-1 ring-slate-400'}" style="${COLORS.includes(p.color)?'':'background:'+p.color}">${COLORS.includes(p.color)?'🎨':''}<input type="color" value="${p.color}" onchange="setC('${p.id}',this.value)" class="absolute inset-0 w-full h-full opacity-0"></label></div><div class="text-xs text-slate-400 mt-2">最後的 🎨 可自訂任意顏色</div></div>`).join('');
  const vrow=S.venues.map(x=>`<div class="${CARD} p-3 mb-2 flex gap-2"><input value="${esc(x.name)}" maxlength="12" oninput="rv('${x.id}',this.value)" class="flex-1 min-w-0 h-12 rounded-xl border-2 border-slate-200 px-3 text-lg font-medium"><button onclick="delV('${x.id}')" class="h-12 px-4 rounded-xl bg-red-50 text-red-500 font-semibold ${BTN}">刪除</button></div>`).join('');
  const add=f=>`<button onclick="${f}" class="w-full h-14 rounded-2xl bg-white border-2 border-dashed border-indigo-400 text-indigo-600 font-bold ${BTN}">`;
  return `<div id="sc" class="fixed inset-0 z-50 bg-slate-100 overflow-y-auto" style="padding-bottom:env(safe-area-inset-bottom)"><div class="max-w-md mx-auto px-3 pb-16"><div class="sticky top-0 z-10 bg-slate-100 flex items-center justify-between pb-3 -mx-3 px-3 shadow-sm" style="padding-top:calc(env(safe-area-inset-top) + 12px)"><b class="text-lg">玩家與場所</b><button onclick="closeSet()" class="h-12 px-6 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold ${BTN}">完成</button></div>
  <b class="block mb-2 mt-3">👥 人員（${S.players.length}）</b>${prow}${add('addP()')}＋ 新增人員</button>
  <b id="venueSec" class="block mt-8 mb-2" style="scroll-margin-top:calc(env(safe-area-inset-top) + 90px)">📍 對弈場所（${S.venues.length}）</b>${vrow}${add('addV()')}＋ 新增場所</button></div></div>`;
}
function openSet(sec){
  const o=$('sc'),t=o?o.scrollTop:0;
  mset(setView());tr($('modal'));document.body.style.overflow='hidden';
  if(sec==='venue')$('venueSec').scrollIntoView();else $('sc').scrollTop=t;
}
const closeSet=()=>{$('modal').innerHTML='';document.body.style.overflow='';render()};
function addP(){const n=S.players.length;S.players.push({id:uid(),name:L('玩家','Player ','プレイヤー')+(n+1),color:COLORS[n%COLORS.length]});save();openSet();const s=$('sc');s.scrollTop=s.scrollHeight}
function sync(id){const p=pl(id);S.games.forEach(g=>g.res.forEach(r=>{if(r.id===id){r.name=p.name;r.color=p.color}}));save()}
function rn(id,v){pl(id).name=v.trim()||L('未命名','Unnamed','名称未設定');sync(id)}
function setC(id,c){pl(id).color=c;sync(id);openSet()}
function delP(id){
  if(!confirm('確定刪除此人員？\n（過往對弈紀錄仍會保留，但不再列入勝率、圖表與排行）'))return;
  S.players=S.players.filter(p=>p.id!==id);D.sel=D.sel.filter(x=>x!==id);save();openSet();
}
function addV(){S.venues.push({id:uid(),name:L('場所','Venue ','場所')+(S.venues.length+1)});save();openSet();const s=$('sc');s.scrollTop=s.scrollHeight}
function rv(id,v){const x=S.venues.find(a=>a.id===id);x.name=v.trim()||L('未命名','Unnamed','名称未設定');S.games.forEach(g=>{if(g.vid===id)g.vname=x.name});save()}
function delV(id){
  if(!confirm('確定刪除此場所？\n（過往紀錄仍會保留場所名稱）'))return;
  S.venues=S.venues.filter(x=>x.id!==id);if(D.vid===id)D.vid='';save();openSet();
}

/* 數字滾動 */
let lastAK='';
function countUp(root){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  root.querySelectorAll('.cu').forEach(el=>{
    const t=el.textContent,m=t.match(/[\d,]+(\.\d+)?/);if(!m)return;
    const end=parseFloat(m[0].replace(/,/g,'')),dec=m[1]?m[1].length-1:0;if(!end)return;
    const a=t.slice(0,m.index),b=t.slice(m.index+m[0].length),t0=performance.now(),D=800;
    const f=n=>{const k=Math.min(1,(n-t0)/D),e=1-Math.pow(1-k,3);
      el.textContent=k>=1?t:a+(end*e).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec})+b;
      if(k<1)requestAnimationFrame(f)};
    requestAnimationFrame(f);
  });
}
/* 主繪製 */
function render(){
  const keep={};document.querySelectorAll('[data-hs]').forEach(e=>keep[e.dataset.hs]=e.scrollLeft);
  const ak=tab+'|'+(tab===3?chartP+'|'+chartY:'')+(tab===4?'|'+rankY:'');const fresh=ak!==lastAK;lastAK=ak;
  $('v').classList.toggle('anim',fresh);$('nav').classList.toggle('anim',fresh);
  $('hdr').innerHTML=hdrHTML();
  $('v').innerHTML=[v0,v1,v2,v3,v4][tab]();
  $('nav').innerHTML=TABS.map((t,i)=>`<button onclick="tab=${i};render();scrollTo(0,0)" class="h-[78px] flex flex-col items-center justify-center gap-1 text-[15px] ${i===tab?'text-indigo-700 font-extrabold nav-on':'text-slate-500 font-semibold'} ${BTN}"><span class="flex items-center justify-center px-5 py-1.5 rounded-2xl transition ${i===tab?'bg-indigo-100':''}">${t[0]}</span>${t[1]}</button>`).join('');
  tr($('hdr'));tr($('v'));tr($('nav'));
  if(tab===1)calc();
  document.querySelectorAll('[data-hs]').forEach(e=>{const k=e.dataset.hs;if(k in keep)e.scrollLeft=keep[k];else{const s=e.querySelector('[data-sel]');if(s)e.scrollLeft=s.offsetLeft-(e.clientWidth-s.offsetWidth)/2}});
  if(tab===3)dragInit($('chartChips'));
  if(fresh)countUp($('v'));
}
/* ===== 左右滑動切換分頁 ===== */
function goTab(n,dir){
  if(n<0||n>4||n===tab)return;
  tab=n;render();scrollTo(0,0);
  const v=$('v');v.classList.remove('sw-l','sw-r');void v.offsetWidth;v.classList.add(dir>0?'sw-l':'sw-r');
}
(()=>{
  let sx=0,sy=0,st=0,ok=false;
  const blocked=t=>!t||!t.closest||t.closest('[data-hs],.overflow-x-auto,[data-pid],input,select,textarea,label');
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||$('modal').innerHTML||$('tour').innerHTML||$('lb').innerHTML){ok=false;return}
    ok=!blocked(e.target);sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!ok)return;ok=false;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-dragEnd<400||Date.now()-st>700)return;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.7)goTab(tab+(dx<0?1:-1),dx<0?1:-1);
  },{passive:true});
})();
render();
</script>
</body>
</html>
